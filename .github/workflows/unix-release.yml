# Linux and macOS downloads for a release. The Windows installer is built locally with build-installer.ps1 and
# attached when the GitHub release is created; publishing that release starts this workflow, which builds the same
# tag on GitHub's Linux and macOS runners and attaches a .tar.gz and two .dmg files to it.
# Run it by hand for an existing tag as well.
name: Linux and macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        shell: pwsh
        run: ./build-unix.ps1 -Rid linux-x64
      - name: Package
        run: |
          version="${TAG#v}"
          name="Drops-$version-linux-x64"
          mv dist/linux-x64 "dist/$name"
          chmod +x "dist/$name/Drops"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        shell: pwsh
        run: ./build-unix.ps1 -Rid ${{ matrix.rid }}
      - name: Package Drops.app and the .dmg
        run: |
          chmod +x tools/macos/make-dmg.sh
          dmg="$(tools/macos/make-dmg.sh ${{ matrix.rid }} "${TAG#v}")"
          echo "ASSET=$dmg" >> "$GITHUB_ENV"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber
